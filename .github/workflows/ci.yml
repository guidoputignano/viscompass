# Required verification for every pull request and every push to main (production closure, 26 Oct 2026; PR25-05).
# Actual TypeScript check, lint, the supported test suite and a production build. No private data, no production
# secret: the public Supabase variables are local placeholders, so nothing here can reach a real project, and the tests
# that need private inputs (the private evidence repository, the pinned PGlite harness, private staging files) are
# reported as skipped with their reasons, never as passed (scripts/ci/report-tests.mjs).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders only: a local address and a dummy key. Never a project URL, key or service-role secret.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Lint
        run: npm run lint
      - name: Tests
        run: node --import ./tests/_register-alias.mjs --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=ci-tests.tap
      - name: Test report (skips and their reasons)
        if: always()
        run: node scripts/ci/report-tests.mjs ci-tests.tap
      - name: Production build
        run: npm run build
